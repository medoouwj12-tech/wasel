<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#shieldGrad)"/>
  
  <!-- Bus Body -->
  <g transform="translate(64, 76)">
    <!-- Main Bus Chassis -->
    <rect x="24" y="40" width="336" height="230" rx="36" fill="#ffffff" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.15))"/>
    
    <!-- Windshield & Windows -->
    <rect x="48" y="70" width="288" height="90" rx="16" fill="#0f172a"/>
    <line x1="192" y1="70" x2="192" y2="160" stroke="#334155" stroke-width="4"/>
    
    <!-- Front Grill / Destination Board -->
    <rect x="110" y="50" width="164" height="12" rx="6" fill="#3b82f6"/>
    
    <!-- Headlights -->
    <circle cx="70" cy="205" r="18" fill="#fbbf24"/>
    <circle cx="70" cy="205" r="10" fill="#fef3c7"/>
    
    <circle cx="314" cy="205" r="18" fill="#fbbf24"/>
    <circle cx="314" cy="205" r="10" fill="#fef3c7"/>
    
    <!-- Radiator Grille -->
    <rect x="130" y="195" width="124" height="24" rx="8" fill="#e2e8f0"/>
    <line x1="150" y1="207" x2="234" y2="207" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Bumper -->
    <rect x="16" y="246" width="352" height="30" rx="12" fill="#1e293b"/>
    
    <!-- Wheels -->
    <rect x="44" y="270" width="60" height="28" rx="8" fill="#0f172a"/>
    <rect x="280" y="270" width="60" height="28" rx="8" fill="#0f172a"/>
    
    <!-- Checkmark Badge on front -->
    <circle cx="192" cy="180" r="28" fill="#10b981"/>
    <path d="M182 180 L189 187 L204 172" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>